name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security vulnerabilities: please report privately, see SECURITY.md."
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did, what you expected, what you saw." }
    validations: { required: true }
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Python SDK, LLM proxy, REST API, Security Console, Engine (detection or policy), Docker / deployment, Other]
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: "Minimal code or requests. Remove keys and private data.", render: shell }
  - type: input
    id: version
    attributes: { label: Version, placeholder: "intentseal 0.1.0, or a commit" }
