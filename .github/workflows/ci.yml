# CI (PRD §12 Testing / §13): lint, secret scan, unit + integration tests. Offline: no provider keys are used;
# the tests use static judges, stub classifiers and scripted models. Evaluation runs (which need free-tier LLM
# keys) are run locally and committed as reports (eval/reports, docs/EVALUATION.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:   # storage contract tests run on SQLite and PostgreSQL (API-12)
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: intentseal-ci
          POSTGRES_DB: intentseal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: System libraries (OpenCV for the OCR extractor; DejaVu font for Unicode PDF fixtures)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 fonts-dejavu-core
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e packages/core -e packages/sdk -e agents -e services/gateway -e eval
      - name: Lint (correctness rules)
        run: ruff check .
      - name: Secret scan (no keys in the repo)
        run: python scripts/secret_scan.py --all
      - name: Fixtures are reproducible
        run: python agents/research_agent/fixtures/build.py
      - name: Tests
        env:
          INTENTSEAL_DB_PATH: ${{ runner.temp }}/intentseal-ci.db
          INTENTSEAL_TEST_DATABASE_URL: postgresql://postgres:intentseal-ci@localhost:5432/intentseal
        run: python -m pytest -q
