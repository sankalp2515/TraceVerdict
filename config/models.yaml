# Roles -> ordered fallback lists of {provider, model}. The router tries them in order.
# Model IDs verified by live calls on 5 Oct 2026 (docs/VALIDATE.md A5). Gemini 2.5 is closed to new
# users; NVIDIA lists Kimi but does not serve it on our account.
# Order is set by Validate results (A1 tool-calling, A5 proxy compatibility), not by guesswork.
#
# price_per_mtok: approximate public list price (USD per million tokens), used ONLY to convert
# free-tier usage into an "equivalent cost" figure for the cost panel / overhead metric (CC7).
# We pay nothing; re-check these before publishing any cost number.

roles:
  # The reference research agent's model (needs reliable tool calling).
  agent:
    cache: false
    defaults: { temperature: 0, max_tokens: 1024 }
    models:
      - { provider: groq,       model: openai/gpt-oss-120b,   price_per_mtok: { input: 0.15, output: 0.60 } }
      - { provider: gemini,     model: gemini-3.1-flash-lite }
      - { provider: nvidia,     model: nvidia/nemotron-3-super-120b-a12b }
      - { provider: groq,       model: qwen/qwen3.8-27b }
      - { provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free" }

  # Tier-2 AI judge (DecisionModel 'generative_free'). Never given tools.
  judge:
    cache: true
    cache_ttl_s: 604800
    defaults: { temperature: 0, max_tokens: 400 }
    models:
      - { provider: groq,       model: openai/gpt-oss-20b,    price_per_mtok: { input: 0.075, output: 0.30 } }
      - { provider: gemini,     model: gemini-3.1-flash-lite }
      - { provider: nvidia,     model: openai/gpt-oss-20b }
      - { provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free" }

  # Adversary loop (EVAL-4): generates variants of our own corpus cases, offline only.
  redteam:
    cache: false
    defaults: { temperature: 0.9, max_tokens: 800 }
    models:
      - { provider: gemini,     model: gemini-3.1-flash-lite }
      - { provider: groq,       model: qwen/qwen3.8-27b }
      - { provider: nvidia,     model: nvidia/nemotron-3-super-120b-a12b }

  # Upstream for the OpenAI-compatible LLM proxy (PRX-4: at least two providers).
  proxy_upstream:
    cache: false
    defaults: { temperature: 0 }
    models:
      - { provider: groq,       model: openai/gpt-oss-120b,   price_per_mtok: { input: 0.15, output: 0.60 } }
      - { provider: gemini,     model: gemini-3.1-flash-lite }
      - { provider: nvidia,     model: nvidia/nemotron-3-super-120b-a12b }
