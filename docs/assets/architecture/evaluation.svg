<text x="40" y="44" font-size="22" font-weight="700" fill="#13213C">Evaluation architecture</text>
<text x="40" y="68" font-size="13.5" fill="#5B6472">Generated attacks, held-out benign sets, protected and unprotected runs on one engine fingerprint, deterministic scoring, generated reports.</text>
<text x="165.0" y="165.5" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">promptfoo</text>
<text x="165.0" y="183.5" font-size="12.5" fill="#9A3412" text-anchor="middle">red-team plugins</text>
<text x="165.0" y="251.5" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">NVIDIA garak</text>
<text x="165.0" y="269.5" font-size="12.5" fill="#9A3412" text-anchor="middle">probe families</text>
<text x="62" y="320" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="start">Attack text is never</text>
<text x="62" y="338" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="start">hand-written (D-005)</text>
<text x="480.0" y="166.0" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">Attack suites</text>
<text x="480.0" y="184.0" font-size="12.5" fill="#9A3412" text-anchor="middle">v3 · headline · v2e · broad · mt3</text>
<text x="480.0" y="202.0" font-size="12.5" fill="#9A3412" text-anchor="middle">out-of-distribution garak</text>
<text x="480.0" y="280.0" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Benign sets</text>
<text x="480.0" y="298.0" font-size="12.5" fill="#4B5563" text-anchor="middle">development hb3 · held-out ho1</text>
<text x="480.0" y="316.0" font-size="12.5" fill="#4B5563" text-anchor="middle">+ 20 utility tasks (benign.py)</text>
<text x="795.0" y="166.0" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">Delivery</text>
<text x="795.0" y="184.0" font-size="12.5" fill="#3B4A63" text-anchor="middle">each payload through 14 channels</text>
<text x="795.0" y="202.0" font-size="12.5" fill="#3B4A63" text-anchor="middle">eval/promptfoo/build_suites.py</text>
<text x="1105.0" y="157.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">off</text>
<text x="1105.0" y="175.5" font-size="12.5" fill="#4B5563" text-anchor="middle">unprotected</text>
<text x="1105.0" y="227.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">on</text>
<text x="1105.0" y="245.5" font-size="12.5" fill="#D6DEEA" text-anchor="middle">full protection</text>
<text x="1105.0" y="297.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">actions</text>
<text x="1105.0" y="315.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">detectors off</text>
<text x="1105.0" y="367.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">detect</text>
<text x="1105.0" y="385.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">content checkpoint, no agent</text>
<rect x="717.8" y="272.0" width="112.4" height="16" fill="#FAFAF7" opacity="0.92"/>
<text x="774.0" y="284.0" font-size="12.5" fill="#374151" text-anchor="middle">false-alarm runs</text>
<text x="1435.0" y="170.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Reference agent</text>
<text x="1435.0" y="188.5" font-size="12.5" fill="#4B5563" text-anchor="middle">arms off · on · actions (detect: none)</text>
<text x="1435.0" y="206.5" font-size="12.5" fill="#4B5563" text-anchor="middle">real model, real tool calls</text>
<text x="1435.0" y="224.5" font-size="12.5" fill="#4B5563" text-anchor="middle">sandbox: canaries, outbox, records</text>
<text x="1435.0" y="334.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">Deterministic scoring</text>
<text x="1435.0" y="352.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">external sends · canary leaks</text>
<text x="1435.0" y="370.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">writes · fetches · record access</text>
<text x="1435.0" y="388.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">engine fingerprint per result</text>
<text x="200.0" y="543.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">summary</text>
<text x="200.0" y="561.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">recall · FPR · attack success</text>
<text x="502.0" y="543.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">paired</text>
<text x="502.0" y="561.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">same attacks · repeats · 95% CI</text>
<text x="804.0" y="543.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">contract_eval</text>
<text x="804.0" y="561.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">detectors bypassed, worst case</text>
<text x="1106.0" y="543.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">redteam</text>
<text x="1106.0" y="561.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">cluster · mutate · repair gate</text>
<text x="1408.0" y="543.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">grid</text>
<text x="1408.0" y="561.5" font-size="12.5" fill="#3B4A63" text-anchor="middle">types × input sources</text>
<rect x="772.3" y="430.0" width="80.4" height="16" fill="#FAFAF7" opacity="0.92"/>
<text x="812.5" y="442.0" font-size="12.5" fill="#374151" text-anchor="middle">raw results</text>
<text x="62" y="612" font-size="12.5" font-weight="400" fill="#5B6472" text-anchor="start">Promotion gate: a red-team repair goes to a reviewer only with ≥ 90% of variants caught and zero new false alarms; nothing deploys itself.</text>
<text x="186.0" y="745.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">EVALUATION.md</text>
<text x="186.0" y="763.5" font-size="12.5" fill="#4B5563" text-anchor="middle">detection, false alarms</text>
<text x="454.0" y="745.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">ASSURANCE.md</text>
<text x="454.0" y="763.5" font-size="12.5" fill="#4B5563" text-anchor="middle">when detection fails</text>
<text x="722.0" y="745.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">COVERAGE.md</text>
<text x="722.0" y="763.5" font-size="12.5" fill="#4B5563" text-anchor="middle">type × source grid</text>
<text x="990.0" y="745.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">README · deck</text>
<text x="990.0" y="763.5" font-size="12.5" fill="#4B5563" text-anchor="middle">metrics from reports</text>
<text x="1385.0" y="728.0" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">CI on every push</text>
<text x="1385.0" y="746.0" font-size="12.5" fill="#3B4A63" text-anchor="middle">pytest: engine, gateway, SDK, storage</text>
<text x="1385.0" y="764.0" font-size="12.5" fill="#3B4A63" text-anchor="middle">lint · secret scan · fixtures rebuilt</text>
