<text x="40" y="44" font-size="22" font-weight="700" fill="#13213C">IntentSeal in context</text>
<text x="40" y="68" font-size="13.5" fill="#5B6472">Between an AI agent and everything it reads and does: content is inspected before the model sees it; tool calls are checked before they run; every decision is recorded.</text>
<text x="175.0" y="287.0" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">Web pages</text>
<text x="175.0" y="344.5" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">Files and documents</text>
<text x="175.0" y="362.5" font-size="12.5" fill="#9A3412" text-anchor="middle">PDF · Word · Markdown · code</text>
<text x="175.0" y="410.5" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">Images</text>
<text x="175.0" y="428.5" font-size="12.5" fill="#9A3412" text-anchor="middle">text read by OCR</text>
<text x="175.0" y="485.0" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">Email</text>
<text x="175.0" y="551.0" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">APIs and databases</text>
<text x="175.0" y="608.5" font-size="15" font-weight="700" fill="#7C2D12" text-anchor="middle">Retrieved passages</text>
<text x="175.0" y="626.5" font-size="12.5" fill="#9A3412" text-anchor="middle">RAG</text>
<text x="475.0" y="150.0" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">User</text>
<text x="500.0" y="341.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Your AI agent</text>
<text x="500.0" y="359.5" font-size="12.5" fill="#4B5563" text-anchor="middle">any framework or language</text>
<text x="500.0" y="511.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Tools and side effects</text>
<text x="500.0" y="529.5" font-size="12.5" fill="#4B5563" text-anchor="middle">send · write · fetch · query</text>
<text x="890.0" y="323.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Inspect content</text>
<text x="890.0" y="341.0" font-size="12.5" fill="#D6DEEA" text-anchor="middle">extract · decode · detect</text>
<text x="890.0" y="359.0" font-size="12.5" fill="#D6DEEA" text-anchor="middle">quarantine or hold</text>
<text x="890.0" y="503.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Check actions</text>
<text x="890.0" y="521.0" font-size="12.5" fill="#D6DEEA" text-anchor="middle">intent contract · allow-lists</text>
<text x="890.0" y="539.0" font-size="12.5" fill="#D6DEEA" text-anchor="middle">pinned fields · secret scan</text>
<text x="1145.0" y="435.5" font-size="15" font-weight="700" fill="#13213C" text-anchor="middle">Decision log</text>
<text x="1145.0" y="453.5" font-size="12.5" fill="#4B5563" text-anchor="middle">rule · evidence · replay</text>
<text x="1440.0" y="321.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Console</text>
<text x="1440.0" y="339.5" font-size="12.5" fill="#4B5563" text-anchor="middle">replay · approvals · review</text>
<text x="1440.0" y="511.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">SIEM</text>
<text x="1440.0" y="529.5" font-size="12.5" fill="#4B5563" text-anchor="middle">JSON Lines · CEF</text>
<text x="1440.0" y="140.5" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Model provider</text>
<text x="1440.0" y="158.5" font-size="12.5" fill="#4B5563" text-anchor="middle">OpenAI · Anthropic · Gemini · …</text>
