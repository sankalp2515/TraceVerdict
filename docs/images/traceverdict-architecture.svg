<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" role="img" aria-label="TraceVerdict implemented architecture: incident evidence to a tested repair"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61728a" /></marker></defs><rect width="1600" height="1320" fill="#f8fafc" /><text x="28" y="38" font-family="Arial,sans-serif" font-size="28" fill="#193253" font-weight="700">TraceVerdict | Incident evidence to a tested repair</text><text x="28" y="65" font-family="Arial,sans-serif" font-size="13" fill="#193253" font-weight="400">IntentSeal supplies enforcement. TraceVerdict investigates, tests bounded repairs and exports a reviewer-approved recommendation.</text><rect x="28" y="90" width="1544" height="125" rx="12" fill="#eef3fa" stroke="#234a78" stroke-width="2" /><text x="44" y="115" font-family="Arial,sans-serif" font-size="14" fill="#193253" font-weight="700">1  CONNECTED AGENTS AND ANALYST</text><rect x="48" y="130" width="470" height="64" rx="8" fill="#e8edf6" stroke="#7889a1" stroke-width="1.4" /><text x="61" y="155" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Connected agent integrations</text><text x="61" y="177" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Foundation proxy / REST / Python SDK; capture import contract</text><rect x="565" y="130" width="460" height="64" rx="8" fill="#e8edf6" stroke="#7889a1" stroke-width="1.4" /><text x="578" y="155" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Local replay agent</text><text x="578" y="177" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Read artifact / summarize / send_message to local outbox only</text><rect x="1070" y="130" width="480" height="64" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="1083" y="155" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Investigation workspace</text><text x="1083" y="177" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Case / evidence graph / policy diff / replay comparison</text><rect x="28" y="245" width="1544" height="160" rx="12" fill="#eef3fa" stroke="#234a78" stroke-width="2" /><text x="44" y="270" font-family="Arial,sans-serif" font-size="14" fill="#193253" font-weight="700">2  FOUNDATION ENFORCEMENT + INCIDENT INTAKE | distinct responsibilities</text><rect x="48" y="285" width="450" height="91" rx="8" fill="#203d61" stroke="#d05a2a" stroke-width="2" /><text x="61" y="310" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="700">Intent compiler + action guard</text><text x="61" y="332" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="400">Reused runtime; replay enforces the historical / patched policy</text><text x="61" y="350" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="400">Policy decisions + decision event IDs + local execution receipts</text><rect x="565" y="285" width="460" height="91" rx="8" fill="#e8edf6" stroke="#7889a1" stroke-width="1.4" /><text x="578" y="310" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Original incident + historical snapshots</text><text x="578" y="332" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Task, document, policy, attempted action and execution receipt</text><text x="578" y="350" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Imported originals are immutable; authenticity operator-attested</text><rect x="1070" y="285" width="480" height="91" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="1.4" /><text x="1083" y="310" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">TraceVerdict capture intake + publisher</text><text x="1083" y="332" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Reviewer registers policy; imports supported JSON capture</text><text x="1083" y="350" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Publish scoped evidence into the three source databases</text><polyline points="280,194 280,285" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="790,194 790,230 520,230 520,330 498,330" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="498,330 565,330" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="1025,330 1070,330" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><rect x="28" y="435" width="1544" height="175" rx="12" fill="#eef3fa" stroke="#234a78" stroke-width="2" /><text x="44" y="460" font-family="Arial,sans-serif" font-size="14" fill="#193253" font-weight="700">3  INVESTIGATION DATA PLANE | Zetaris is the required live investigation access path</text><rect x="48" y="475" width="450" height="105" rx="8" fill="#f1f2f5" stroke="#7d8798" stroke-width="1.4" /><text x="61" y="500" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Three independent PostgreSQL sources</text><text x="61" y="522" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Operational events / findings / actions / execution receipts</text><text x="61" y="540" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Configuration: versioned policy / contract / tool snapshots</text><text x="61" y="558" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Reference: trusted contacts / expectations / evaluation records</text><rect x="565" y="475" width="460" height="105" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="578" y="500" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Zetaris governed SQL views</text><text x="578" y="522" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Native USL case-evidence view; source membership joins</text><text x="578" y="540" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Read-only templates; tenant + agent + case scoping</text><text x="578" y="558" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Evidence IDs, source versions, snapshot watermark</text><rect x="1070" y="475" width="480" height="105" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="1083" y="500" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Evidence repository + graph builder</text><text x="1083" y="522" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Source-linked claims; no arbitrary SQL from model</text><text x="1083" y="540" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Typed evidence / claim links; inference is not causation</text><text x="1083" y="558" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Immutable evidence IDs, source versions and content hashes</text><polyline points="498,525 565,525" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="1025,525 1070,525" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><rect x="28" y="640" width="1070" height="285" rx="12" fill="#eef3fa" stroke="#234a78" stroke-width="2" /><text x="44" y="665" font-family="Arial,sans-serif" font-size="14" fill="#193253" font-weight="700">4  NEW CASE WORKFLOW | bounded agent loop</text><rect x="48" y="683" width="312" height="86" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="61" y="708" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Investigator</text><text x="61" y="730" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Evidence-grounded claims with cited evidence IDs</text><text x="61" y="748" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Qualified hypotheses + explicit uncertainty</text><rect x="390" y="683" width="312" height="86" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="403" y="708" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Evidence critic</text><text x="403" y="730" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Challenge claims; request missing facts</text><text x="403" y="748" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Reject causal claims without support</text><rect x="732" y="683" width="344" height="86" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="745" y="708" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Repair planner</text><text x="745" y="730" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Max 2 typed candidate diffs</text><text x="745" y="748" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Only supported policy fields</text><rect x="48" y="808" width="460" height="88" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="61" y="833" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Meterless World Model engine (Python)</text><text x="61" y="855" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Canonical provenance events; stable IDs; rebuilt context</text><text x="61" y="873" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Actual application engine passes upstream conformance: 8/8</text><rect x="565" y="808" width="511" height="88" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="578" y="833" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Workflow controller</text><text x="578" y="855" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Collect → explain → challenge → propose → validate</text><text x="578" y="873" font-family="Arial,sans-serif" font-size="11" fill="#193253" font-weight="400">Max 2 revisions; unresolved → inconclusive; failures → incomplete</text><polyline points="1320,580 1320,625 204,625 204,683" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="360,725 390,725" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="702,725 732,725" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="540,769 540,790 200,790 200,769" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><text x="295" y="784" font-family="Arial,sans-serif" font-size="11" fill="#506179" font-weight="400">revise if unsupported</text><polyline points="278,808 278,788 820,788 820,808" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="958,769 958,808" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><rect x="1125" y="640" width="447" height="285" rx="12" fill="#eef3fa" stroke="#234a78" stroke-width="2" /><text x="1141" y="665" font-family="Arial,sans-serif" font-size="14" fill="#193253" font-weight="700">5  MODEL SERVICE | no enforcement authority</text><rect x="1145" y="683" width="407" height="86" rx="8" fill="#f1f4fc" stroke="#6880ba" stroke-width="1.4" stroke-dasharray="4 4" /><text x="1158" y="708" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Nightshift → NVIDIA Nemotron</text><text x="1158" y="730" font-family="Arial,sans-serif" font-size="11" fill="#193253" font-weight="400">Lightning: investigator / critic / repair; Ultra: replay agent</text><text x="1158" y="748" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Explicit routes; response IDs, model IDs and usage retained</text><rect x="1145" y="808" width="407" height="88" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="1158" y="833" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Runtime failure handling</text><text x="1158" y="855" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">No direct-provider silent fallback</text><text x="1158" y="873" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Incomplete report + deterministic facts</text><polyline points="1090,720 1145,720" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><text x="1097" y="706" font-family="Arial,sans-serif" font-size="11" fill="#506179" font-weight="400">AI calls</text><rect x="28" y="955" width="1544" height="235" rx="12" fill="#eef3fa" stroke="#234a78" stroke-width="2" /><text x="44" y="980" font-family="Arial,sans-serif" font-size="14" fill="#193253" font-weight="700">6  SANDBOX VALIDATION AND REVIEW | deterministic promotion boundary</text><rect x="48" y="996" width="450" height="100" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="61" y="1021" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Snapshot replay runner → local action guard</text><text x="61" y="1043" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">A. fixed action boundary replay</text><text x="61" y="1061" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">B. paired model-driven tasks in supported local executors</text><text x="61" y="1079" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">No real sends; reset fixtures per run</text><rect x="565" y="996" width="460" height="100" rx="8" fill="#203d61" stroke="#d05a2a" stroke-width="2" /><text x="578" y="1021" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="700">Repair acceptance gate</text><text x="578" y="1043" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="400">Baseline reproduction + targeted control change</text><text x="578" y="1061" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" font-weight="400">Frozen synthetic unsafe + benign tasks; no broad benchmark claim</text><text x="578" y="1079" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="400">Reject broad block-all and stale / partial results</text><rect x="1070" y="996" width="480" height="100" rx="8" fill="#e8f4f1" stroke="#15816c" stroke-width="2" /><text x="1083" y="1021" font-family="Arial,sans-serif" font-size="15" fill="#193253" font-weight="700">Reviewer + recommendation export</text><text x="1083" y="1043" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Evidence + exact policy diff + frozen test manifest</text><text x="1083" y="1061" font-family="Arial,sans-serif" font-size="11" fill="#193253" font-weight="400">Approval binds policy, patch and report hashes / runtime profile</text><text x="1083" y="1079" font-family="Arial,sans-serif" font-size="12" fill="#193253" font-weight="400">Authenticated review; applied: false; no deployment endpoint</text><polyline points="820,896 820,937 273,937 273,996" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="498,1048 565,1048" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="1025,1048 1070,1048" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><text x="48" y="1158" font-family="Arial,sans-serif" font-size="16" fill="#193253" font-weight="700">Result: evidence-backed explanation + graph + candidate patch + bounded replay results + explicit uncertainty.</text><polyline points="1555,1048 1565,1048 1565,227 1310,227 1310,194" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><text x="1350" y="1222" font-family="Arial,sans-serif" font-size="11" fill="#506179" font-weight="400">report back to workspace</text><text x="30" y="1260" font-family="Arial,sans-serif" font-size="13" fill="#193253" font-weight="400">GREEN  TraceVerdict implementation     BLUE / GREY  Integrations / evidence sources     ORANGE  Deterministic guard / gate</text><text x="30" y="1287" font-family="Arial,sans-serif" font-size="13" fill="#193253" font-weight="400">Boundaries: evidence is untrusted; model text cannot approve repairs or change frozen expectations; local replay sends no external messages.</text><polyline points="1310,376 1310,407 273,407 273,475" fill="none" stroke="#61728a" stroke-width="1.7" marker-end="url(#arrow)" /><polyline points="1120,580 1120,617 38,617 38,800 278,800 278,808" fill="none" stroke="#61728a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" /></svg>