[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentseal-eval"
version = "0.1.0"
description = "Evaluation harness for IntentSeal"
requires-python = ">=3.11"
dependencies = ["intentseal-core", "intentseal-research-agent", "fastapi", "uvicorn", "pyyaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["intentseal_eval*", "targets*"]
