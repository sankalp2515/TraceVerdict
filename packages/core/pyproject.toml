[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentseal-core"
version = "0.1.0"
description = "IntentSeal Core Engine: inspection, policy and action guard for LLM agents"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  # extraction (CORE-2) and normalisation (CORE-3), library-first (D-016)
  "beautifulsoup4>=4.12",
  "pypdf>=4",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "ftfy>=6.1",
  "anyascii>=0.3",
  "confusable-homoglyphs>=3.2",
  # outbound secret scan (CORE-9)
  "detect-secrets>=1.4",
]

[project.optional-dependencies]
classifiers = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23", "numpy>=1.26"]
ocr = ["rapidocr-onnxruntime>=1.3", "pillow>=10"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
intentseal = "intentseal_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intentseal_core*"]
