[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asg-sdk"
version = "0.1.0"
description = "IntentSeal Python SDK: keep AI agents inside the user's intent"
requires-python = ">=3.11"
dependencies = ["asg-core", "httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["asg_sdk*"]
