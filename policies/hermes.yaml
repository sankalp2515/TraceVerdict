# Policy for Hermes Agent (NousResearch, github.com/NousResearch/hermes-agent) connected through the LLM proxy:
# Hermes' custom endpoint is http://localhost:8000/proxy/hermes/v1 (docs/INTEGRATION.md, "Connect an existing agent").
# Everything Hermes reads comes back as a tool result and is inspected before the model sees it; the tools that can
# change things or send data out are checked before Hermes runs them. Hermes has 40+ tools: the ones below are the
# ones that act; the rest (search, memory, todo, skills, ...) are allowed and their results are still inspected.
# No upstream: Hermes' model calls use the gateway's own model chain (Groq, Gemini, NVIDIA), which fails over when one is busy.
agent: hermes
version: "1"
mode: enforce
task_scope: "A personal assistant that reads the user's files, email and web pages, runs commands and writes files when asked."
tools:
  read_file:        { risk: low,    failure: open }
  search_files:     { risk: low,    failure: open }
  web_search:       { risk: low,    failure: open }
  web_extract:      { risk: medium, failure: open }
  browser_navigate: { risk: medium, failure: open }
  write_file:       { risk: medium, failure: closed }
  patch:            { risk: medium, failure: closed }
  # Hermes runs commands for ordinary work (reading, listing, searching), so commands are not tied to the user's
  # wording. They are held for approval when the session has taken in flagged content, or when an argument carries
  # text from flagged content (data-flow trace): the ways an injection turns into a command.
  terminal:         { risk: high,   failure: closed, escalate_if_uncertain: true }
  execute_code:     { risk: high,   failure: closed, escalate_if_uncertain: true }
  send_message:     { risk: high,   failure: closed, escalate_if_uncertain: true,
                      intent_terms: [send, email, mail, reply, forward, message, notify, share] }
unknown_tools: allow
sensitive_data:
  patterns: [api_key, credential, customer_record]
  canaries: [from_env]
  drop_non_visible: true
thresholds:
  judge_untrusted: always
