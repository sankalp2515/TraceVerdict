[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asg-gateway"
version = "0.1.0"
description = "IntentSeal Gateway API + OpenAI-compatible LLM proxy"
requires-python = ">=3.11"
dependencies = ["asg-core", "asg-sdk", "asg-research-agent", "fastapi>=0.110", "uvicorn[standard]", "pyyaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["asg_gateway*"]
